name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Compile Python modules
        run: python -m compileall -q App DataBase Handlers Services Utils Main.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
